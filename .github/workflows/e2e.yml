name: End-to-end tests

# The plugin in the Magento Docker stack, orders through the checkout,
# deliveries to a local receiver (tests/e2e/run.sh). install-test checks
# the module's separate current distribution channel, the built zip
# extracted into app/code by hand (tests/install/run.sh). Also called by
# release.yml (workflow_call), which releases only when both pass.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  e2e:
    name: End-to-end tests
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Only Docker is needed: every tool runs in a container.
      - name: Run the end-to-end tests
        run: make e2e

      - name: Upload the deliveries received
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: var/e2e
          if-no-files-found: ignore

  install-test:
    name: Install/uninstall (the built zip, in app/code)
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run the install/uninstall check
        run: make install-test

      - name: Upload the stack log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-test-results
          path: var/install-test/stack.log
          if-no-files-found: ignore
